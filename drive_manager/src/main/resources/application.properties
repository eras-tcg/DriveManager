server.port=8081
spring.application.name=drive_manager
spring.config.import=optional:file:drive_manager/.env[.properties],optional:file:.env[.properties]

# MongoDB Configuration
spring.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# Cloudflare R2 Configuration
r2.account-id=${R2_ACCOUNT_ID}
r2.access-key-id=${R2_ACCESS_KEY_ID}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY}
r2.bucket-name=${R2_BUCKET_NAME:drive-cards}
r2.public-url=${R2_PUBLIC_URL}
# Cards' illustrations: a local folder instead of R2 (local development only)
card-art.dir=${CARD_ART_DIR:}

# Disable multipart parsing — no endpoint uses multipart uploads (images come as the raw body).
spring.servlet.multipart.enabled=false

# JWT (shared secret with UsersService)
jwt.secret=${JWT_SECRET}

# CORS Configuration
# Behind CloudFront + nginx: trust X-Forwarded-Proto/For from the proxy so the site's own calls (https://erastcg.com,
# www, staging) count as same-origin and never depend on CORS_ALLOWED_ORIGINS; other origins are still checked.
server.forward-headers-strategy=native
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
# The Android app (Capacitor: its page is served at https://localhost) calls the API by its full address; always allowed
cors.app-origins=${CORS_APP_ORIGINS:https://localhost}

# Logging Configuration
logging.level.root=INFO
logging.level.com.drive.drive_manager=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG
# Offline games against the bot, credited when the player connects again (OfflineGames; every honest game counts, no cap
# on the games accepted): games looked at a day per player (accepted or not; over it the game is "retry", kept by the
# site and sent again: a guard against a client sending junk, never a loss), how old a game may be, the bounds of one
# game, the replay's time budget, how many replays run at once, and the size of one upload
offline-games.daily-replays=${OFFLINE_GAMES_DAILY_REPLAYS:200}
offline-games.window-days=${OFFLINE_GAMES_WINDOW_DAYS:30}
offline-games.max-actions=5000
offline-games.max-bot-moves=20000
offline-games.replay-budget-ms=${OFFLINE_GAMES_REPLAY_BUDGET_MS:120000}
offline-games.concurrent-replays=${OFFLINE_GAMES_CONCURRENT_REPLAYS:1}
offline-games.max-request-bytes=2000000
offline-games.max-games-per-request=10
