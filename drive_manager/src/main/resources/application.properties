server.port=8081
spring.application.name=drive_manager
spring.config.import=optional:file:drive_manager/.env[.properties],optional:file:.env[.properties]

# MongoDB Configuration
spring.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# Google Drive Configuration
drive.sa.project-id=${DRIVE_SA_PROJECT_ID}
drive.sa.private-key-id=${DRIVE_SA_PRIVATE_KEY_ID}
drive.sa.private-key=${DRIVE_SA_PRIVATE_KEY}
drive.sa.client-email=${DRIVE_SA_CLIENT_EMAIL}
drive.sa.client-id=${DRIVE_SA_CLIENT_ID}
drive.base-folder-id=${DRIVE_BASE_FOLDER_ID}
# Public HTTPS URL Google will POST change notifications to.
# Leave empty for local dev. Set to your real URL (e.g. via Cloudflare Tunnel) when deploying.
drive.webhook-url=${DRIVE_WEBHOOK_URL:}
drive.webhook-token=${DRIVE_WEBHOOK_TOKEN}
# Unique identifier for this environment (e.g. "prod", "staging").
# Used as the sync_state document ID so each environment manages its own Drive channel.
drive.instance-id=${DRIVE_INSTANCE_ID:drive}
# A server that sleeps until someone visits: check Drive for changes when it starts (it receives no webhook while asleep)
drive.catch-up-on-start=${DRIVE_CATCH_UP_ON_START:false}
ngrok.auth-token=${NGROK_AUTH_TOKEN:}

# Quartz Scheduler Configuration
spring.quartz.job-store-type=memory
spring.quartz.properties.org.quartz.scheduler.instanceName=quartzScheduler
spring.quartz.properties.org.quartz.threadPool.threadCount=10

# Cloudflare R2 Configuration
r2.account-id=${R2_ACCOUNT_ID}
r2.access-key-id=${R2_ACCESS_KEY_ID}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY}
r2.bucket-name=${R2_BUCKET_NAME:drive-cards}
r2.public-url=${R2_PUBLIC_URL}

# Disable multipart parsing — no endpoint uses file uploads, and the
# Drive webhook sends an empty body whose Content-Type would otherwise
# trigger multipart resolution and throw MalformedStreamException.
spring.servlet.multipart.enabled=false

# JWT (shared secret with UsersService)
jwt.secret=${JWT_SECRET}

# CORS Configuration
# Behind CloudFront + nginx: trust X-Forwarded-Proto/For from the proxy so the site's own calls (https://erastcg.com,
# www, staging) count as same-origin and never depend on CORS_ALLOWED_ORIGINS; other origins are still checked.
server.forward-headers-strategy=native
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Logging Configuration
logging.level.root=INFO
logging.level.com.drive.drive_manager=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG
# Offline games against the bot, credited when the player connects again (OfflineGames): accepted games a day per player,
# games played again a day per player (accepted or not), how old a game may be, the bounds of one game, the replay's
# time budget, how many replays run at once, and the size of one upload
offline-games.daily-cap=${OFFLINE_GAMES_DAILY_CAP:20}
offline-games.daily-replays=${OFFLINE_GAMES_DAILY_REPLAYS:40}
offline-games.window-days=${OFFLINE_GAMES_WINDOW_DAYS:30}
offline-games.max-actions=5000
offline-games.max-bot-moves=20000
offline-games.replay-budget-ms=${OFFLINE_GAMES_REPLAY_BUDGET_MS:120000}
offline-games.concurrent-replays=${OFFLINE_GAMES_CONCURRENT_REPLAYS:1}
offline-games.max-request-bytes=2000000
offline-games.max-games-per-request=10
