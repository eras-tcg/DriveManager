services:
  drive_manager:
    build:
      # The repository root: the image builds the game's engine (../eras-engine) too
      context: ..
      dockerfile: drive_manager/Dockerfile
    image: drive_manager:latest
    container_name: drive_manager
    ports:
      - "8081:8081"
    env_file:
      - .env
    restart: unless-stopped
