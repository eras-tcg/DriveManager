# Build on GitHub, publish to GHCR, deploy with eras-tcg/infra (self-hosted runner in the VPS).
#   PR to develop/main -> build only
#   push to develop    -> build + push + deploy staging
#   push to main       -> build + push + deploy production (waits for approval)
#   Run workflow       -> redeploy an existing image (rollback)
name: CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        required: true
      image_tag:
        description: Commit sha of an image already published (see a previous run)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/eras-tcg/drive-manager:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on develop/main)
        uses: docker/build-push-action@v6
        with:
          context: ./drive_manager
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/eras-tcg/drive-manager:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: build
    permissions:
      contents: read
      packages: read
    uses: eras-tcg/infra/.github/workflows/deploy.yml@main
    with:
      service: drive-manager
      environment: staging
      image: ${{ needs.build.outputs.image }}

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      contents: read
      packages: read
    uses: eras-tcg/infra/.github/workflows/deploy.yml@main
    with:
      service: drive-manager
      environment: production
      image: ${{ needs.build.outputs.image }}

  redeploy:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: read
    uses: eras-tcg/infra/.github/workflows/deploy.yml@main
    with:
      service: drive-manager
      environment: ${{ inputs.environment }}
      image: ghcr.io/eras-tcg/drive-manager:${{ inputs.image_tag }}
