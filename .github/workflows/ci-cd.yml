# Build on GitHub, publish to GHCR, deploy to AWS with eras-tcg/infra (deploy-aws.yml: image copied to ECR,
# eras-deploy on the server through SSM with healthcheck and rollback).
# Deploys never wait for the tests (user, 2026-11-23: the long tests run after the release, not before it).
#   PR to main          -> the image only (candidate for its exact code, tag candidate-<git tree>)
#   push to main        -> the PR's image is promoted (or built if there is none) and deployed to production at once
#                          (approval); tests and engine run alongside the deploy and only report
#   push to develop     -> image, tests and engine (develop is optional: PRs go straight to main)
#   Run workflow        -> deploy an existing image to production (a rollback). No staging since 2026-11-26
# Every job has a time limit, so nothing can hold the pipeline.
name: CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [production]
        required: true
      image_tag:
        description: Commit sha of an image already published (see a previous run)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Push to main: was this exact code (its git tree) already built in its PR?
  tested:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      tree: ${{ steps.check.outputs.tree }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: check
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "ghcr.io/eras-tcg/drive-manager:candidate-$tree" > /dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Built in its PR: candidate-$tree"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Not built as is: building the image"
          fi

  # Tests report only: they run on pushes, alongside the deploy, and never hold it
  test:
    needs: tested
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    env:
      MONGODB_URI: "mongodb://localhost:27017/eras_test"
      JWT_SECRET: "test-only-jwt-secret-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173"
      R2_ACCOUNT_ID: "test"
      R2_ACCESS_KEY_ID: "test"
      R2_SECRET_ACCESS_KEY: "test"
      R2_PUBLIC_URL: "https://example.invalid"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: gradle/actions/setup-gradle@v4
      # The server depends on the game's engine (com.eras:eras-engine-jvm), built from eras-engine/
      - name: Build the engine into the local Maven repository
        working-directory: eras-engine
        run: ./gradlew --no-daemon publishToMavenLocal
      - name: Run tests (dummy config, throwaway MongoDB)
        working-directory: drive_manager
        run: mvn -B -ntp verify

  # The Kotlin Multiplatform engine (eras-engine/: the game's core in common Kotlin): its tests on the JVM and on Node,
  # its npm package (kept as an artifact) and a game played with it, then its artifact against java.util.Random and Jackson
  # from DriveManager's Java (the kmp-engine profile). The server's own build (test job, image) builds the engine first.
  engine:
    needs: tested
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: gradle/actions/setup-gradle@v4
      - name: Engine tests (JVM and JavaScript) and publish to the local Maven repository
        working-directory: eras-engine
        run: ./gradlew --no-daemon build publishToMavenLocal
      # The npm package eras-web will use for games against the bot offline (LocalMatch): ES modules, TypeScript
      # definitions, the card bundle, the bot's resources and the starter decks; a whole game played with it on Node.
      # Kept as this run's artifact (not published to any registry).
      - name: The npm package @eras/engine and a game played with it on Node
        working-directory: eras-engine
        run: |
          ./gradlew --no-daemon jsBrowserProductionLibraryDistribution
          node js-smoke/smoke.mjs build/dist/js/productionLibrary
      - name: Keep the npm package
        uses: actions/upload-artifact@v4
        with:
          name: eras-engine-npm
          path: eras-engine/build/dist/js/productionLibrary
          if-no-files-found: error
      - name: The engine from DriveManager's Java
        working-directory: drive_manager
        run: mvn -B -ntp -Pkmp-engine test -Dtest='KotlinEngineInteropTest' -Dsurefire.failIfNoSpecifiedTests=false

  # The image: published under the commit's sha, and on a PR (from this repository) as the candidate for its code,
  # which the push to main deploys as is
  build:
    needs: tested
    if: ${{ !cancelled() && github.event_name != 'workflow_dispatch' && needs.tested.outputs.ready != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/eras-tcg/drive-manager:${{ github.sha }}
      tree: ${{ steps.tree.outputs.tree }}
    env:
      PUBLISH: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
      - id: tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on develop/main)
        uses: docker/build-push-action@v6
        with:
          # The repository root: the image builds the game's engine (eras-engine) before the server
          context: .
          file: drive_manager/Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ghcr.io/eras-tcg/drive-manager:${{ github.sha }}
            ghcr.io/eras-tcg/drive-manager:candidate-${{ steps.tree.outputs.tree }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Push to main with code built in its PR: its image under this commit's sha, ready to deploy
  promote:
    needs: tested
    if: ${{ needs.tested.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker buildx imagetools create             -t "ghcr.io/eras-tcg/drive-manager:${{ github.sha }}"             "ghcr.io/eras-tcg/drive-manager:candidate-${{ needs.tested.outputs.tree }}"

  deploy-production:
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.promote.result == 'success' || needs.build.result == 'success') }}
    needs: [promote, build]
    permissions:
      contents: read
      packages: read
    uses: eras-tcg/infra/.github/workflows/deploy-aws.yml@main
    secrets: inherit
    with:
      service: drive-manager
      environment: production
      image_tag: ${{ github.sha }}

  redeploy:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: read
    uses: eras-tcg/infra/.github/workflows/deploy-aws.yml@main
    secrets: inherit
    with:
      service: drive-manager
      environment: ${{ inputs.environment }}
      image_tag: ${{ inputs.image_tag }}
