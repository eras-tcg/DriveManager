# Build on GitHub, publish to GHCR, deploy to AWS with eras-tcg/infra (deploy-aws.yml: image copied to ECR,
# eras-deploy on the server through SSM with healthcheck and rollback).
#   PR to develop/main -> tests + build only
#   push to develop    -> build + push + deploy staging
#   push to main       -> build + push + deploy production (waits for approval)
#   Run workflow       -> redeploy an existing image (rollback)
name: CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        required: true
      image_tag:
        description: Commit sha of an image already published (see a previous run)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    env:
      MONGODB_URI: "mongodb://localhost:27017/eras_test"
      JWT_SECRET: "test-only-jwt-secret-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173"
      DRIVE_BASE_FOLDER_ID: "test-folder"
      DRIVE_SA_PROJECT_ID: "test-project"
      DRIVE_SA_PRIVATE_KEY_ID: "test"
      DRIVE_SA_PRIVATE_KEY: "test"
      DRIVE_SA_CLIENT_EMAIL: "test@example.com"
      DRIVE_SA_CLIENT_ID: "0"
      DRIVE_WEBHOOK_TOKEN: "test"
      DRIVE_WEBHOOK_URL: "https://example.invalid/api/drive/webhook"
      R2_ACCOUNT_ID: "test"
      R2_ACCESS_KEY_ID: "test"
      R2_SECRET_ACCESS_KEY: "test"
      R2_PUBLIC_URL: "https://example.invalid"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run tests (dummy config, throwaway MongoDB)
        working-directory: drive_manager
        run: mvn -B -ntp verify

  build:
    if: github.event_name != 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/eras-tcg/drive-manager:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on develop/main)
        uses: docker/build-push-action@v6
        with:
          context: ./drive_manager
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/eras-tcg/drive-manager:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: build
    permissions:
      contents: read
      packages: read
    uses: eras-tcg/infra/.github/workflows/deploy-aws.yml@main
    secrets: inherit
    with:
      service: drive-manager
      environment: staging
      image_tag: ${{ github.sha }}

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      contents: read
      packages: read
    uses: eras-tcg/infra/.github/workflows/deploy-aws.yml@main
    secrets: inherit
    with:
      service: drive-manager
      environment: production
      image_tag: ${{ github.sha }}

  redeploy:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: read
    uses: eras-tcg/infra/.github/workflows/deploy-aws.yml@main
    secrets: inherit
    with:
      service: drive-manager
      environment: ${{ inputs.environment }}
      image_tag: ${{ inputs.image_tag }}
