# Build on GitHub, publish to GHCR, deploy to AWS with eras-tcg/infra (deploy-aws.yml: image copied to ECR,
# eras-deploy on the server through SSM with healthcheck and rollback).
#   PR to develop/main -> tests + build only
#   push to develop    -> tests + build + push the image (staging is not deployed: it is an optional step)
#   push to main       -> build + push + deploy production (waits for approval)
#   Run workflow       -> deploy an existing image: staging on demand (sha of a develop run), or a rollback
name: CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        required: true
      image_tag:
        description: Commit sha of an image already published (see a previous run)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    env:
      MONGODB_URI: "mongodb://localhost:27017/eras_test"
      JWT_SECRET: "test-only-jwt-secret-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173"
      DRIVE_BASE_FOLDER_ID: "test-folder"
      DRIVE_SA_PROJECT_ID: "test-project"
      DRIVE_SA_PRIVATE_KEY_ID: "test"
      DRIVE_SA_PRIVATE_KEY: "test"
      DRIVE_SA_CLIENT_EMAIL: "test@example.com"
      DRIVE_SA_CLIENT_ID: "0"
      DRIVE_WEBHOOK_TOKEN: "test"
      DRIVE_WEBHOOK_URL: "https://example.invalid/api/drive/webhook"
      R2_ACCOUNT_ID: "test"
      R2_ACCESS_KEY_ID: "test"
      R2_SECRET_ACCESS_KEY: "test"
      R2_PUBLIC_URL: "https://example.invalid"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: gradle/actions/setup-gradle@v4
      # The server depends on the game's engine (com.eras:eras-engine-jvm), built from eras-engine/
      - name: Build the engine into the local Maven repository
        working-directory: eras-engine
        run: ./gradlew --no-daemon publishToMavenLocal
      - name: Run tests (dummy config, throwaway MongoDB)
        working-directory: drive_manager
        run: mvn -B -ntp verify

  # The Kotlin Multiplatform engine (eras-engine/: the game's core in common Kotlin): its tests on the JVM and on Node,
  # its npm package (kept as an artifact) and a game played with it, then its artifact against java.util.Random and Jackson
  # from DriveManager's Java (the kmp-engine profile). The server's own build (test job, image) builds the engine first.
  engine:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: gradle/actions/setup-gradle@v4
      - name: Engine tests (JVM and JavaScript) and publish to the local Maven repository
        working-directory: eras-engine
        run: ./gradlew --no-daemon build publishToMavenLocal
      # The npm package eras-web will use for games against the bot offline (LocalMatch): ES modules, TypeScript
      # definitions, the card bundle, the bot's resources and the starter decks; a whole game played with it on Node.
      # Kept as this run's artifact (not published to any registry).
      - name: The npm package @eras/engine and a game played with it on Node
        working-directory: eras-engine
        run: |
          ./gradlew --no-daemon jsBrowserProductionLibraryDistribution
          node js-smoke/smoke.mjs build/dist/js/productionLibrary
      - name: Keep the npm package
        uses: actions/upload-artifact@v4
        with:
          name: eras-engine-npm
          path: eras-engine/build/dist/js/productionLibrary
          if-no-files-found: error
      - name: The engine from DriveManager's Java
        working-directory: drive_manager
        run: mvn -B -ntp -Pkmp-engine test -Dtest='KotlinEngineInteropTest' -Dsurefire.failIfNoSpecifiedTests=false

  build:
    if: github.event_name != 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/eras-tcg/drive-manager:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on develop/main)
        uses: docker/build-push-action@v6
        with:
          # The repository root: the image builds the game's engine (eras-engine) before the server
          context: .
          file: drive_manager/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/eras-tcg/drive-manager:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      contents: read
      packages: read
    uses: eras-tcg/infra/.github/workflows/deploy-aws.yml@main
    secrets: inherit
    with:
      service: drive-manager
      environment: production
      image_tag: ${{ github.sha }}

  redeploy:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: read
    uses: eras-tcg/infra/.github/workflows/deploy-aws.yml@main
    secrets: inherit
    with:
      service: drive-manager
      environment: ${{ inputs.environment }}
      image_tag: ${{ inputs.image_tag }}
