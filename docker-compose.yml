services:
  drive-manager:
    build:
      # The repository root: the image builds the game's engine (eras-engine) too
      context: .
      dockerfile: drive_manager/Dockerfile
    container_name: drive-manager-${ENVIRONMENT:-prod}
    ports:
      - "${DRIVE_MANAGER_PORT:-8081}:8081"
    env_file:
      - ./drive_manager/.env
    restart: unless-stopped
    networks:
      - eras-network

networks:
  eras-network:
    external: false
